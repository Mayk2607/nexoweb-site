services:
  nexoweb-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexoweb_v2_app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nexoweb.mx}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-notificaciones@nexoweb.mx}
      RESEND_TO: ${RESEND_TO:-consultoria@nexoweb.mx}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CRM_API_URL: ${CRM_API_URL:-http://backend:3010}
      CRM_INGEST_SECRET: ${CRM_INGEST_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nexoweb_net

networks:
  nexoweb_net:
    name: nexoweb_net
    external: true
